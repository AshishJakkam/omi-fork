# Codemagic build for the AshishJakkam/omi-fork fork.
#
# Produces an UNSIGNED .ipa. Sideloadly re-signs it with your own Apple ID on
# Windows, so this workflow needs no certificates, no provisioning profiles, no
# App Store Connect key and no Apple Developer membership. That keeps the first
# physical-device test cheap and fast.
#
# Identity choices that differ from upstream (see ios/Flutter/devDebug.xcconfig):
#   bundle id            com.omi.fork        (App Store Omi stays installed)
#   auth callback scheme  omifork            (no omi-dev:// clash)
#   app group             group.com.omi.fork (no shared-container clash)
#
# Known limitation: Google Sign-In still points at Omi's Firebase project
# (GOOGLE_REVERSE_CLIENT_ID), which is bound to the original bundle id. Replace
# it with your own Firebase iOS app once that project exists. Until then use
# email/password or the local backend for testing.

workflows:
  ios-unsigned:
    name: iOS unsigned ipa (dev flavor, sideload)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      # Pinned to the exact versions Omi uses to ship this app's iOS build, so we
      # inherit a known-good toolchain rather than discovering incompatibilities.
      flutter: 3.44.5
      xcode: 27.0
      cocoapods: 1.16.2
      vars:
        BUNDLE_ID: com.omi.fork
        # The prod flavour uses the production profile, which pins
        # API_BASE_URL=https://api.omi.me/ and refuses anything else. That is what
        # makes the phone work untethered: no PC, no local backend, just internet.
        #
        # Sign-in cannot use the native Google SDK - Omi's OAuth client is bound to
        # their bundle id and would reject ours. USE_WEB_AUTH=true routes through
        # the backend's /v1/auth/authorize web flow instead, whose redirect is our
        # own custom scheme (omifork://auth/callback). backend/routers/auth.py
        # explicitly permits custom app schemes for per-bundle test builds.
        FLUTTER_FLAVOR: prod
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    working_directory: app
    scripts:
      - name: Install Opus
        script: |
          # opus_flutter_ios links the system libopus.
          brew install opus || brew upgrade opus

      - name: Set up app .env
        script: |
          set -e
          if [ ! -f .env ]; then cp .env.template .env; fi
          # Pin the values the web-auth + production-routing path depends on.
          # USE_WEB_AUTH is compile-time (envied generates lib/env/*.g.dart from
          # .env during build_runner), so it must be set BEFORE that step.
          set_env() {
            key="$1"; value="$2"
            if grep -q "^${key}=" .env; then
              sed -i.bak "s|^${key}=.*|${key}=${value}|" .env && rm -f .env.bak
            else
              echo "${key}=${value}" >> .env
            fi
          }
          set_env API_BASE_URL "https://api.omi.me/"
          set_env USE_WEB_AUTH "true"
          echo '--- .env (secrets redacted) ---'
          sed -E 's/(KEY|SECRET)=.*/\1=<redacted>/' .env

      - name: Install production Firebase plist
        script: |
          # The prod flavour reads ios/Runner/GoogleService-Info.plist. Committed
          # client config for the production environment.
          cp setup/release-firebase/GoogleService-Info.prod.plist ios/Runner/GoogleService-Info.plist
          /usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' ios/Runner/GoogleService-Info.plist || true

      - name: Generate iOS custom config
        script: |
          # Writes ios/Flutter/Custom.xcconfig (gitignored). prodRelease.xcconfig
          # includes it and then overrides bundle id and callback scheme, so our
          # com.omi.fork identity wins regardless of what this generates.
          bash scripts/generate_ios_custom_config.sh ios/Runner/GoogleService-Info.plist ios/Flutter/ || true

      - name: Get packages
        script: |
          flutter --version
          dart --version
          flutter pub get

      - name: Run build_runner
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Pod install
        script: |
          cd ios
          pod install --repo-update

      - name: Verify identity before building
        script: |
          set -e
          echo "--- prodRelease.xcconfig (effective identity) ---"
          cat ios/Flutter/prodRelease.xcconfig
          echo "--- Custom.xcconfig generated by CI ---"
          cat ios/Flutter/Custom.xcconfig
          echo "--- USE_WEB_AUTH baked into the generated env ---"
          grep -o 'USE_WEB_AUTH=[a-z]*' .env
          echo "--- callback scheme registered in Info.plist ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' ios/Runner/Info.plist | grep -A2 auth || true

      - name: Use free-tier entitlements
        script: |
          # The prod flavour signs against RunnerRelease-prod.entitlements, which
          # asks for App Groups, Push, HealthKit, Hotspot, Wi-Fi info and
          # Associated Domains. A free Apple ID cannot grant any of those and
          # Sideloadly's stripping is not guaranteed to cover every combination,
          # so ask for nothing instead. Background audio and on-device
          # transcription do not need entitlements, so nothing under test is lost.
          cp ios/Runner/RunnerRelease-fork.entitlements ios/Runner/RunnerRelease-prod.entitlements
          echo "--- entitlements now used by the prod Release config ---"
          cat ios/Runner/RunnerRelease-prod.entitlements

      - name: Build (no codesign)
        script: |
          set -e
          echo "Flavor: $FLUTTER_FLAVOR"
          echo "API base: https://api.omi.me/ (pinned by the production profile)"
          flutter build ios --release --no-codesign --flavor "$FLUTTER_FLAVOR"
          echo "--- built app ---"
          ls -la build/ios/iphoneos/

      - name: Package unsigned ipa (free-tier safe)
        script: |
          set -e
          cd build/ios/iphoneos

          APP=Runner.app
          echo "Packaging $APP"

          # Free ("Personal Team") provisioning cannot grant App Groups or Push,
          # and every nested bundle needs its own App ID from a 10-per-week quota.
          # Sideloadly has to sign each nested bundle too, which is the most common
          # place a sideload fails. Strip them so the ipa is a single, flat app.
          echo "--- nested bundles before strip ---"
          ls -la "$APP/PlugIns" 2>/dev/null || echo "(no PlugIns)"
          rm -rf "$APP/PlugIns" "$APP/Watch" "$APP/com.apple.WatchPlaceholder"

          # The watch app can also be embedded directly by the watch target.
          find "$APP" -maxdepth 2 -name '*.appex' -type d -exec rm -rf {} + 2>/dev/null || true

          echo "--- nested bundles after strip ---"
          ls -la "$APP/PlugIns" 2>/dev/null || echo "(none - good)"

          echo "Bundle id baked into the app:"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          echo "Display name:"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" || echo "(none)"

          rm -rf Payload OmiFork.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry OmiFork.ipa Payload
          ls -lh OmiFork.ipa

    artifacts:
      - app/build/ios/iphoneos/OmiFork.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - $CM_EMAIL
        notify:
          success: true
          failure: true
